<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Zezo Game - Match 3</title>
  <style>
    :root{
      --bg1:#2b1a4a;
      --bg2:#4a2a7a;
      --panel:#ffffff14;
      --panel-border:#ffffff30;
      --text:#fff5ff;
      --accent:#ffda6b;
      --danger:#ff6b8b;
      --ok:#73f2b5;
      --shadow:0 10px 30px rgba(0,0,0,.35);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:radial-gradient(circle at 20% 10%,#5f3fa2 0%,var(--bg2) 30%,var(--bg1) 100%);color:var(--text);overflow:hidden}
    .app{height:100%;display:flex;flex-direction:column}
    .safe{padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(env(safe-area-inset-bottom) + 8px) env(safe-area-inset-left);height:100%;display:flex;flex-direction:column}
    .topbar{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 10px}
    .pill{background:var(--panel);border:1px solid var(--panel-border);padding:10px 12px;border-radius:14px;box-shadow:var(--shadow);backdrop-filter:blur(4px);font-weight:700;font-size:14px;min-width:95px;text-align:center}
    .centerArea{flex:1;display:grid;place-items:center;padding:8px}
    .boardWrap{position:relative;width:min(92vw,92vh,780px);aspect-ratio:1/1;border-radius:20px;background:linear-gradient(180deg,#ffffff18,#00000022);border:1px solid #ffffff3a;box-shadow:var(--shadow),inset 0 2px 10px rgba(255,255,255,.15),inset 0 -5px 20px rgba(0,0,0,.3);padding:10px}
    .grid{position:relative;width:100%;height:100%;border-radius:14px;overflow:hidden;background:
      linear-gradient(90deg,#ffffff14 1px,transparent 1px) 0 0/12.5% 12.5%,
      linear-gradient(#ffffff14 1px,transparent 1px) 0 0/12.5% 12.5%,
      radial-gradient(circle at 30% 30%,#ffffff10,transparent 60%);
    }
    .tile{
      position:absolute;display:grid;place-items:center;border-radius:16%;
      box-shadow:inset 0 2px 0 rgba(255,255,255,.45), inset 0 -4px 10px rgba(0,0,0,.25), 0 2px 8px rgba(0,0,0,.25);
      color:#fff;font-size:1.8vmin;font-weight:900;user-select:none;touch-action:none;
      transition:transform .22s cubic-bezier(.2,.8,.2,1), opacity .18s ease;
    }
    .tile .emoji{filter:drop-shadow(0 2px 1px rgba(0,0,0,.25));font-size:clamp(18px,3.8vmin,34px)}
    .tile.matching{animation:pop .26s ease}
    @keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.15)}100%{transform:scale(0.98)}}
    .hudRow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 10px}
    .btn{border:none;border-radius:12px;padding:10px 14px;font-weight:800;color:#2f214f;background:linear-gradient(180deg,#ffe896,#ffc93e);box-shadow:0 6px 15px rgba(0,0,0,.2);cursor:pointer}
    .btn:active{transform:translateY(1px)}
    .banner{
      margin:6px 10px 0;border-radius:12px;padding:10px 12px;background:linear-gradient(90deg,#ffffff18,#ffffff10);
      border:1px dashed #ffffff55;text-align:center;font-weight:700;font-size:13px
    }
    .overlay{position:fixed;inset:0;background:rgba(15,9,30,.75);display:grid;place-items:center;z-index:9}
    .card{width:min(92vw,460px);background:linear-gradient(180deg,#6e47b9,#4e328e);border:1px solid #ffffff50;border-radius:18px;padding:22px;text-align:center;box-shadow:var(--shadow)}
    .title{font-size:clamp(28px,6vw,44px);font-weight:900;margin:0 0 8px}
    .subtitle{opacity:.9;margin:0 0 16px}
    .combo{position:absolute;left:50%;top:10%;transform:translate(-50%,0);font-weight:900;font-size:clamp(22px,5vw,42px);text-shadow:0 4px 14px rgba(0,0,0,.35);pointer-events:none;opacity:0}
    .combo.show{animation:floatText .9s ease}
    @keyframes floatText{0%{opacity:0;transform:translate(-50%,10px) scale(.7)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,-26px) scale(1.08)}}
    .small{font-size:12px;opacity:.85}
    @media (min-width:900px){
      .pill{font-size:16px}
      .btn{padding:12px 16px}
    }
  </style>
</head>
<body>
<div class="app">
  <div class="safe">
    <div class="topbar">
      <div class="pill">Score: <span id="score">0</span></div>
      <div class="pill">Level: <span id="level">1</span></div>
      <div class="pill">Moves: <span id="moves">25</span></div>
    </div>

    <div class="centerArea">
      <div class="boardWrap">
        <div class="combo" id="comboText">Sweet!</div>
        <div class="grid" id="grid"></div>
      </div>
    </div>

    <div class="hudRow">
      <button class="btn" id="rewardBtn">+5 Moves (Rewarded)</button>
      <button class="btn" id="restartBtn">Restart</button>
    </div>
    <div class="banner">📢 Banner Ad Placeholder (Responsive)</div>
  </div>
</div>

<div class="overlay" id="startOverlay">
  <div class="card">
    <h1 class="title">Zezo Game</h1>
    <p class="subtitle">Match 3 candies, trigger combos, and beat level goals!</p>
    <button class="btn" id="startBtn">Start Game</button>
    <p class="small" style="margin-top:12px">Swipe candies up/down/left/right</p>
  </div>
</div>

<div class="overlay" id="gameOverOverlay" style="display:none">
  <div class="card">
    <h2 class="title" style="font-size:34px">Game Over</h2>
    <p class="subtitle">Final Score: <span id="finalScore">0</span></p>
    <button class="btn" id="playAgainBtn">Play Again</button>
  </div>
</div>

<div class="overlay" id="interstitialOverlay" style="display:none">
  <div class="card">
    <h2 class="title" style="font-size:30px">Interstitial Ad</h2>
    <p class="subtitle">Sponsored break between levels</p>
    <button class="btn" id="closeInterstitial">Continue</button>
  </div>
</div>

<script>
(() => {
  const SIZE = 8;
  const TYPES = [
    {e:"🍭", c:"#ff5da2"},
    {e:"🍬", c:"#6ad6ff"},
    {e:"🧸", c:"#7fe28a"},
    {e:"🍩", c:"#ffa657"},
    {e:"🧁", c:"#b794ff"},
    {e:"🍫", c:"#ffd86b"}
  ];

  let board = [];
  let score = 0, level = 1, moves = 25, goal = 1000;
  let busy = false, started = false;
  const grid = document.getElementById("grid");

  const scoreEl = document.getElementById("score");
  const levelEl = document.getElementById("level");
  const movesEl = document.getElementById("moves");
  const comboEl = document.getElementById("comboText");

  const startOverlay = document.getElementById("startOverlay");
  const gameOverOverlay = document.getElementById("gameOverOverlay");
  const finalScore = document.getElementById("finalScore");
  const interstitial = document.getElementById("interstitialOverlay");

  function randType(){ return Math.floor(Math.random()*TYPES.length); }

  function hasMatchAt(r,c){
    const t = board[r][c];
    if(t===null) return false;
    if(c>=2 && board[r][c-1]===t && board[r][c-2]===t) return true;
    if(r>=2 && board[r-1][c]===t && board[r-2][c]===t) return true;
    return false;
  }

  function initBoard(){
    board = Array.from({length:SIZE},()=>Array(SIZE).fill(null));
    for(let r=0;r<SIZE;r++){
      for(let c=0;c<SIZE;c++){
        do { board[r][c] = randType(); } while(hasMatchAt(r,c));
      }
    }
    renderBoard();
    updateHUD();
  }

  function updateHUD(){
    scoreEl.textContent = score;
    levelEl.textContent = level;
    movesEl.textContent = moves;
  }

  function tileRect(r,c){
    const pad = 6;
    const cell = grid.clientWidth / SIZE;
    return {x:c*cell+pad,y:r*cell+pad,w:cell-pad*2,h:cell-pad*2};
  }

  function renderBoard(){
    grid.innerHTML = "";
    for(let r=0;r<SIZE;r++){
      for(let c=0;c<SIZE;c++){
        const t = board[r][c];
        if(t===null) continue;
        const d = document.createElement("div");
        d.className = "tile";
        d.dataset.r=r; d.dataset.c=c;
        const rect = tileRect(r,c);
        d.style.left = rect.x+"px"; d.style.top = rect.y+"px";
        d.style.width = rect.w+"px"; d.style.height = rect.h+"px";
        d.style.background = `radial-gradient(circle at 30% 25%,#ffffff99,${TYPES[t].c} 45%,#00000033 130%)`;
        d.innerHTML = `<div class="emoji">${TYPES[t].e}</div>`;
        addDrag(d);
        grid.appendChild(d);
      }
    }
  }

  function findMatches(){
    const out = new Set();
    for(let r=0;r<SIZE;r++){
      let run=1;
      for(let c=1;c<=SIZE;c++){
        if(c<SIZE && board[r][c]===board[r][c-1]) run++;
        else{
          if(run>=3){ for(let k=0;k<run;k++) out.add(`${r},${c-1-k}`); }
          run=1;
        }
      }
    }
    for(let c=0;c<SIZE;c++){
      let run=1;
      for(let r=1;r<=SIZE;r++){
        if(r<SIZE && board[r][c]===board[r-1][c]) run++;
        else{
          if(run>=3){ for(let k=0;k<run;k++) out.add(`${r-1-k},${c}`); }
          run=1;
        }
      }
    }
    return [...out].map(s=>s.split(",").map(Number));
  }

  function swap(a,b){
    const t=board[a.r][a.c]; board[a.r][a.c]=board[b.r][b.c]; board[b.r][b.c]=t;
  }

  function adjacent(a,b){ return Math.abs(a.r-b.r)+Math.abs(a.c-b.c)===1; }

  async function resolveBoard(chain=0){
    let matches = findMatches();
    if(!matches.length) return chain;
    matches.forEach(([r,c]) => board[r][c]=null);
    score += matches.length * 50 * (chain+1);
    showCombo(chain);
    applyGravity();
    refill();
    renderBoard();
    updateHUD();
    await wait(200);
    return resolveBoard(chain+1);
  }

  function applyGravity(){
    for(let c=0;c<SIZE;c++){
      let wr=SIZE-1;
      for(let r=SIZE-1;r>=0;r--){
        if(board[r][c]!==null){ board[wr][c]=board[r][c]; if(wr!==r) board[r][c]=null; wr--; }
      }
    }
  }
  function refill(){
    for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++) if(board[r][c]===null) board[r][c]=randType();
  }
  function wait(ms){ return new Promise(res=>setTimeout(res,ms)); }

  function showCombo(chain){
    const txt = chain>=2 ? "Zezo Combo!" : chain===1 ? "Tasty!" : "Sweet!";
    comboEl.textContent = txt;
    comboEl.classList.remove("show");
    void comboEl.offsetWidth;
    comboEl.classList.add("show");
    beep(260 + chain*90, .08);
  }

  async function tryMove(a,b){
    if(busy || !adjacent(a,b)) return;
    busy = true;
    swap(a,b); renderBoard();
    await wait(180);
    const m = findMatches();
    if(!m.length){
      swap(a,b); renderBoard();
      // elastic revert feel
      const tiles=[...grid.children];
      tiles.forEach(t=>t.style.transition='transform .35s cubic-bezier(.17,.89,.32,1.49)');
      await wait(230);
    }else{
      moves--;
      beep(420,.06);
      await resolveBoard(0);
      if(score>=goal){
        level++;
        moves += 10;
        goal = Math.floor(goal*1.45);
        showInterstitial();
      }
    }
    if(moves<=0) endGame();
    updateHUD();
    busy = false;
  }

  function addDrag(el){
    let sx=0, sy=0, active=false;
    const origin = {r:+el.dataset.r,c:+el.dataset.c};
    el.addEventListener("pointerdown", e=>{
      if(busy || !started) return;
      active=true; sx=e.clientX; sy=e.clientY;
      el.setPointerCapture(e.pointerId);
      el.style.zIndex=4;
    });
    el.addEventListener("pointermove", e=>{
      if(!active) return;
      const dx=e.clientX-sx, dy=e.clientY-sy;
      el.style.transform=`translate(${dx*0.35}px,${dy*0.35}px) scale(1.06)`;
    });
    el.addEventListener("pointerup", e=>{
      if(!active) return;
      active=false;
      const dx=e.clientX-sx, dy=e.clientY-sy;
      el.style.transform="translate(0,0) scale(1)";
      el.style.zIndex=1;
      let target={...origin};
      if(Math.max(Math.abs(dx),Math.abs(dy))>16){
        if(Math.abs(dx)>Math.abs(dy)) target.c += dx>0?1:-1;
        else target.r += dy>0?1:-1;
      }
      if(target.r<0||target.r>=SIZE||target.c<0||target.c>=SIZE) return;
      tryMove(origin,target);
    });
  }

  function beep(freq=440, dur=.06){
    const ctx = beep.ctx || (beep.ctx = new (window.AudioContext||window.webkitAudioContext)());
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type='triangle'; o.frequency.value=freq;
    g.gain.value=.001; g.gain.exponentialRampToValueAtTime(.08, ctx.currentTime+.01);
    g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime+dur);
    o.connect(g).connect(ctx.destination); o.start(); o.stop(ctx.currentTime+dur);
  }

  function endGame(){
    started=false;
    finalScore.textContent = score;
    gameOverOverlay.style.display="grid";
  }

  function showInterstitial(){
    interstitial.style.display="grid";
  }

  document.getElementById("startBtn").onclick=()=>{
    started=true; startOverlay.style.display="none"; initBoard(); beep(520,.08);
  };
  document.getElementById("restartBtn").onclick=()=>{
    score=0; level=1; moves=25; goal=1000; started=true; gameOverOverlay.style.display="none"; initBoard();
  };
  document.getElementById("playAgainBtn").onclick=()=>{
    score=0; level=1; moves=25; goal=1000; started=true; gameOverOverlay.style.display="none"; initBoard();
  };
  document.getElementById("rewardBtn").onclick=()=>{
    moves += 5; updateHUD(); beep(700,.09);
  };
  document.getElementById("closeInterstitial").onclick=()=>{ interstitial.style.display="none"; };

  window.addEventListener("resize", renderBoard);
})();
</script>
</body>
</html>
